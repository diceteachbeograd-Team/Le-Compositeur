name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-ci-success:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI for tag releases
        uses: actions/github-script@v8
        with:
          script: |
            const isTagRef = context.ref.startsWith("refs/tags/");
            if (!isTagRef) {
              core.info(`Non-tag run (${context.ref}), skipping CI gate.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const workflowId = "ci.yml";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const timeoutMs = 20 * 60 * 1000;
            const pollMs = 15 * 1000;
            const start = Date.now();

            core.info(`Waiting for CI workflow (${workflowId}) on commit ${sha}...`);
            while (Date.now() - start < timeoutMs) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: "push",
                per_page: 20,
              });
              const run = data.workflow_runs.find((item) => item.head_sha === sha);
              if (!run) {
                core.info("No CI run found for this commit yet.");
                await sleep(pollMs);
                continue;
              }

              core.info(`Found CI run ${run.id}: status=${run.status} conclusion=${run.conclusion}`);
              if (run.status !== "completed") {
                await sleep(pollMs);
                continue;
              }
              if (run.conclusion === "success") {
                core.info(`CI gate passed: ${run.html_url}`);
                return;
              }

              core.setFailed(`CI gate failed: ${run.html_url} (conclusion=${run.conclusion})`);
              return;
            }

            core.setFailed(`Timed out waiting for green CI on commit ${sha}.`);

  build-artifacts:
    name: Build ${{ matrix.name }}
    needs: verify-ci-success
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI and GUI binaries
        run: cargo build --release -p wc-gui -p wc-cli

      - name: Build Linux bundles (.tar.gz + .deb + .rpm)
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm rsync desktop-file-utils dpkg-dev
          chmod +x scripts/build-alpha-rpm.sh scripts/build-alpha-deb.sh scripts/smoke-linux-packages.sh

          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *-* ]]; then
            BASE="${TAG%-*}"
            IDX="${TAG##*-}"
          else
            BASE="$TAG"
            IDX="1"
          fi

          mkdir -p dist/le-compositeur-linux-x86_64-bundle/bin
          mkdir -p dist/le-compositeur-linux-x86_64-bundle/quotes
          cp target/release/wc-gui dist/le-compositeur-linux-x86_64-bundle/bin/le-compositeur
          cp target/release/wc-cli dist/le-compositeur-linux-x86_64-bundle/bin/le-compositeur-cli
          ln -sf le-compositeur dist/le-compositeur-linux-x86_64-bundle/bin/wc-gui
          ln -sf le-compositeur-cli dist/le-compositeur-linux-x86_64-bundle/bin/wc-cli
          cp assets/quotes/local/local-quotes.md dist/le-compositeur-linux-x86_64-bundle/quotes/local-quotes.md
          chmod +x dist/le-compositeur-linux-x86_64-bundle/bin/le-compositeur
          chmod +x dist/le-compositeur-linux-x86_64-bundle/bin/le-compositeur-cli
          cp README.md LICENSE dist/le-compositeur-linux-x86_64-bundle/
          tar -C dist -czf dist/le-compositeur-linux-x86_64.tar.gz le-compositeur-linux-x86_64-bundle

          WC_SKIP_CARGO_BUILD=1 ./scripts/build-alpha-deb.sh "${TAG}"
          WC_SKIP_CARGO_BUILD=1 WC_RPM_NODEPS=1 ./scripts/build-alpha-rpm.sh "${TAG}"

          DEB_PKG="dist/le-compositeur_${TAG}_amd64.deb"
          if [[ ! -f "${DEB_PKG}" ]]; then
            echo "Expected deb package not found: ${DEB_PKG}"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "${DEB_PKG}" dist/le-compositeur-linux-x86_64.deb

          RPM_PKG="$(find "$HOME/rpmbuild/RPMS" -type f -name "le-compositeur-${BASE}-${IDX}*.rpm" | sort | tail -n1)"
          if [[ -z "${RPM_PKG}" || ! -f "${RPM_PKG}" ]]; then
            RPM_PKG="$(find "$HOME/rpmbuild/RPMS" -type f -name "le-compositeur-*.rpm" | sort | tail -n1)"
          fi
          if [[ -z "${RPM_PKG}" || ! -f "${RPM_PKG}" ]]; then
            echo "Expected rpm package not found in \$HOME/rpmbuild/RPMS"
            find "$HOME/rpmbuild/RPMS" -type f | sort || true
            exit 1
          fi
          cp "${RPM_PKG}" dist/le-compositeur-linux-x86_64.rpm

          ./scripts/smoke-linux-packages.sh

      - name: Build Windows bundles (.zip + .exe)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          & target/release/wc-cli.exe doctor | Out-Null
          New-Item -ItemType Directory -Force -Path dist/le-compositeur-windows-x86_64/bin | Out-Null
          Copy-Item target/release/wc-gui.exe dist/le-compositeur-windows-x86_64/bin/LeCompositeur.exe
          Copy-Item target/release/wc-cli.exe dist/le-compositeur-windows-x86_64/bin/le-compositeur-cli.exe
          Copy-Item target/release/wc-cli.exe dist/le-compositeur-windows-x86_64/bin/wc-cli.exe
          New-Item -ItemType Directory -Force -Path dist/le-compositeur-windows-x86_64/quotes | Out-Null
          Copy-Item assets/quotes/local/local-quotes.md dist/le-compositeur-windows-x86_64/quotes/local-quotes.md
          Copy-Item README.md, LICENSE dist/le-compositeur-windows-x86_64/
          Compress-Archive -Path dist/le-compositeur-windows-x86_64 -DestinationPath dist/le-compositeur-windows-x86_64.zip -Force

          # Smoke-check the packaged zip output, not only the build tree binary.
          Remove-Item -Recurse -Force dist/smoke-unzip -ErrorAction SilentlyContinue
          Expand-Archive -Path dist/le-compositeur-windows-x86_64.zip -DestinationPath dist/smoke-unzip -Force
          & dist/smoke-unzip/le-compositeur-windows-x86_64/bin/wc-cli.exe doctor | Out-Null

      - name: Build macOS ARM bundle (.dmg)
        if: matrix.name == 'macos-arm64'
        run: |
          set -euo pipefail
          target/release/wc-cli doctor >/dev/null
          APP_NAME="Le Compositeur.app"
          APP_ROOT="dist/${APP_NAME}/Contents"
          ICONSET_DIR="dist/le-compositeur.iconset"
          mkdir -p "${APP_ROOT}/MacOS" "${APP_ROOT}/Resources" "${ICONSET_DIR}"

          cp target/release/wc-gui "${APP_ROOT}/MacOS/LeCompositeur"
          cp target/release/wc-cli "${APP_ROOT}/MacOS/le-compositeur-cli"
          cp target/release/wc-cli "${APP_ROOT}/MacOS/wc-cli"
          chmod +x "${APP_ROOT}/MacOS/LeCompositeur"
          chmod +x "${APP_ROOT}/MacOS/le-compositeur-cli"
          chmod +x "${APP_ROOT}/MacOS/wc-cli"
          mkdir -p "${APP_ROOT}/Resources/quotes"
          cp assets/quotes/local/local-quotes.md "${APP_ROOT}/Resources/quotes/local-quotes.md"

          # Build a proper .icns from the repository PNG icon.
          cp assets/icons/le-compositeur.png "${ICONSET_DIR}/icon_512x512@2x.png"
          sips -z 16 16     assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_16x16.png" >/dev/null
          sips -z 32 32     assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_32x32.png" >/dev/null
          sips -z 64 64     assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_128x128.png" >/dev/null
          sips -z 256 256   assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_256x256.png" >/dev/null
          sips -z 512 512   assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   assets/icons/le-compositeur.png --out "${ICONSET_DIR}/icon_512x512.png" >/dev/null
          iconutil -c icns "${ICONSET_DIR}" -o "${APP_ROOT}/Resources/le-compositeur.icns"

          cat > "${APP_ROOT}/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>Le Compositeur</string>
              <key>CFBundleDisplayName</key>
              <string>Le Compositeur</string>
              <key>CFBundleIdentifier</key>
              <string>com.diceteachbeograd.lecompositeur</string>
              <key>CFBundleExecutable</key>
              <string>LeCompositeur</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIconFile</key>
              <string>le-compositeur.icns</string>
              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSHumanReadableCopyright</key>
              <string>diceteachbeograd-Team</string>
            </dict>
          </plist>
          PLIST

          # Ad-hoc signing improves launch reliability for unsigned CI artifacts.
          codesign --force --deep --sign - "dist/${APP_NAME}"

          mkdir -p dist/dmg-root
          cp -R "dist/${APP_NAME}" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Le Compositeur" -srcfolder "dist/dmg-root" -ov -format UDZO "dist/le-compositeur-macos-apple-silicon-arm64.dmg"

          # Smoke-check the dmg output by mounting and running bundled CLI.
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "${MOUNT_DIR}" -quiet >/dev/null 2>&1 || true; rmdir "${MOUNT_DIR}" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "dist/le-compositeur-macos-apple-silicon-arm64.dmg" -mountpoint "${MOUNT_DIR}" -nobrowse -quiet
          "${MOUNT_DIR}/Le Compositeur.app/Contents/MacOS/wc-cli" doctor >/dev/null
          hdiutil detach "${MOUNT_DIR}" -quiet
          rmdir "${MOUNT_DIR}" >/dev/null 2>&1 || true
          trap - EXIT

      - name: Upload Linux release files
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-x86_64
          path: |
            dist/le-compositeur-linux-x86_64.tar.gz
            dist/le-compositeur-linux-x86_64.deb
            dist/le-compositeur-linux-x86_64.rpm

      - name: Upload Windows release files
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v5
        with:
          name: release-windows-x86_64
          path: |
            dist/le-compositeur-windows-x86_64.zip

      - name: Upload macOS release files
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v5
        with:
          name: release-macos-arm64
          path: |
            dist/le-compositeur-macos-apple-silicon-arm64.dmg

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > RELEASE_BODY.md <<'EOF'
          ## Le Compositeur Release

          Direct downloads:
          - Latest releases page: https://github.com/diceteachbeograd-Team/Le-Compositeur/releases/latest
          - This tag: https://github.com/diceteachbeograd-Team/Le-Compositeur/releases/tag/${{ github.ref_name }}

          Included artifacts:
          - Linux: `le-compositeur-linux-x86_64.tar.gz`, `le-compositeur-linux-x86_64.deb`, `le-compositeur-linux-x86_64.rpm`
          - Windows: `le-compositeur-windows-x86_64.zip`
          - macOS ARM (Apple Silicon): `le-compositeur-macos-apple-silicon-arm64.dmg`

          Release process guarantees:
          - Tag release is blocked until CI (`fmt`, `clippy`, `test`) is green for the tagged commit.
          - Linux `.deb` / `.rpm` are produced from the same repo scripts used for local package validation.
          - Linux package smoke checks run automatically in CI:
            - `.deb` install + `wc-cli doctor` on Ubuntu runner
            - `.rpm` install + `wc-cli doctor` in clean Fedora 43 container
          - Windows release zip is smoke-tested after archive creation (`wc-cli.exe doctor` from extracted zip).
          - macOS ARM dmg is smoke-tested by mounting the dmg and running bundled `wc-cli doctor`.
          - Linux/Windows/macOS artifacts include both GUI and CLI binaries plus bundled local quotes.
          - Linux default profile is Lite (`WC_LITE_PROFILE=1`) with low-memory visual workflow.

          Operator notes:
          - If upgrading manually from package files, prefer install-over-upgrade to keep desktop entry/icon refresh deterministic.
          - Recommended quick verification after install:
            - `wc-cli validate`
            - `wc-cli run --once`
            - start `le-compositeur` and verify Compose + Sources/Visuals workflow.
          - macOS artifact is ad-hoc signed in CI and can require explicit trust action on first launch.

          Project notes:
          - End-user application name: **Le Compositeur**
          - Project attribution: **diceteachbeograd-Team**
          EOF

      - name: Publish release once (no duplicated notes)
        uses: softprops/action-gh-release@v2
        with:
          name: Le Compositeur ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre') }}
          files: release-assets/*
